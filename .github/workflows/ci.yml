name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate bundled examples
        run: |
          python3 plugins/er-bundle/skills/er-bundle/scripts/validate.py \
            examples/minimal.erd.json \
            examples/ecommerce.erd.json \
            examples/team.erd.json \
            plugins/er-bundle/skills/er-bundle/examples/minimal.erd.json \
            plugins/er-bundle/skills/er-bundle/examples/ecommerce.erd.json \
            plugins/er-bundle/skills/er-bundle/examples/team.erd.json

      - name: Run tests
        run: python3 -m unittest discover -s plugins/er-bundle/skills/er-bundle/tests -v

      - name: Verify schema copy matches root
        run: diff erd-bundle.schema.json plugins/er-bundle/skills/er-bundle/references/schema.json
